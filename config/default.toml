version = 1
# Declaration only: recorded with each run and passed to child environments. It
# does not detect the actual orchestrator; setting this to "codex" does not make
# Codex the orchestrator.
parent_harness = "claude"
# Enforcement is on by default. Set this to "off" to opt out everywhere, or
# use [projects."/absolute/path"] with mode = "off" to opt out per project.
# A project mode overrides this setting; set mode = "on" there to opt back in.
mode = "on"
runtime_root = "~/.local/state/cross-harness"
retention_days = 7
auth_cache_hours = 24
context_threshold_percent = 70
max_parallel = 2
dirty_worktree_policy = "allow_delegated"
# Dirty-worktree policies: "stop", "isolate", "allow", or "allow_delegated".
delegate_kinds = ["exploration", "implementation", "test", "debug", "review", "security_review"]

# Role settings: each role has harness, model, and effort.
#
# harness  Execution target. Only "claude" or "codex" are accepted. This is the
#          switch that decides where a role runs; changing model alone does not
#          move a role to another harness. Any role can be assigned to either.
#
# model    Not validated. Any non-empty string is accepted, so a new model can
#          be used the day it ships -- and a typo is only caught at run time.
#          Known values at the time of writing:
#            codex   gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna
#            claude  fable, opus, sonnet, haiku
#          The [fallback] chains below are used for escalation on retry, so a
#          model listed there can be escalated one step up.
#
# effort   Not rejected either; `validate` only warns outside the known values:
#            codex   minimal, low, medium, high, xhigh
#            claude  low, medium, high, xhigh, max
#          Claude effort applies only to models that support it. A role on
#          haiku ignores this value entirely, so model controls that role's
#          cost.
#
# When changes take effect:
#   codex roles   the next delegate
#   claude roles  the next Claude session (the session-start hook syncs
#                 ~/.claude/agents/cross-harness-*.md)
#
# orchestrator is the running session itself, so its model and effort describe
# the parent session rather than a delegated agent.

[fallback]
codex = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna"]
claude = ["opus", "sonnet", "haiku"]

[roles.orchestrator]
harness = "claude"
model = "opus"
effort = "xhigh"
max_parallel = 1
retries = 0
timeout_seconds = 3600
write = false
output_limit_chars = 8000
delegate_kinds = []

[roles.explorer]
harness = "claude"
model = "haiku"
effort = "low"
max_parallel = 1
retries = 0
timeout_seconds = 900
write = false
output_limit_chars = 6000
delegate_kinds = ["exploration"]

[roles.implementer]
harness = "codex"
model = "gpt-5.6-terra"
effort = "high"
max_parallel = 1
retries = 2
timeout_seconds = 3600
write = true
output_limit_chars = 8000
delegate_kinds = ["implementation", "test"]

[roles.tester]
# Codex read-only disallows every write, so checks that write caches cannot run;
# returning tester to Codex would make those checks fail silently.
harness = "claude"
model = "haiku"
effort = "medium"
max_parallel = 1
retries = 2
timeout_seconds = 1800
write = false
output_limit_chars = 8000
delegate_kinds = ["test"]

[roles.reviewer]
harness = "claude"
model = "opus"
effort = "high"
max_parallel = 1
retries = 0
timeout_seconds = 1800
write = false
output_limit_chars = 8000
delegate_kinds = ["review"]

[roles.debugger]
harness = "codex"
model = "gpt-5.6-sol"
effort = "high"
max_parallel = 1
retries = 2
timeout_seconds = 3600
write = true
output_limit_chars = 10000
delegate_kinds = ["debug"]

[roles.security_reviewer]
harness = "codex"
model = "gpt-5.6-sol"
effort = "xhigh"
max_parallel = 1
retries = 0
timeout_seconds = 3600
write = false
output_limit_chars = 10000
delegate_kinds = ["review", "security_review"]
