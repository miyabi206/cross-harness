version = 1
parent_harness = "claude"
runtime_root = "~/.local/state/cross-harness"
retention_days = 7
auth_cache_hours = 24
context_threshold_percent = 70
max_parallel = 2
dirty_worktree_policy = "stop"
delegate_kinds = ["exploration", "implementation", "test", "debug", "review", "security_review"]

# Known effort values are codex: minimal/low/medium/high/xhigh and claude:
# low/medium/high/xhigh/max. They are compatibility guidance only: validation
# passes through new effort values unchanged.
# Routing is determined by each role's harness field; changing model alone does
# not switch harnesses. Change a role's harness to assign it to either Codex or
# Claude; any role with delegate_kinds can be delegated through its harness.

[fallback]
codex = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna"]
claude = ["fable", "sonnet", "haiku"]

[roles.orchestrator]
harness = "claude"
model = "fable[1m]"
effort = "xhigh"
max_parallel = 1
retries = 0
timeout_seconds = 3600
write = false
output_limit_chars = 8000
delegate_kinds = []

[roles.explorer]
harness = "claude"
model = "haiku"
effort = "low"
max_parallel = 1
retries = 0
timeout_seconds = 900
write = false
output_limit_chars = 6000
delegate_kinds = ["exploration"]

[roles.planner]
harness = "claude"
model = "fable[1m]"
effort = "xhigh"
max_parallel = 1
retries = 0
timeout_seconds = 1800
write = false
output_limit_chars = 8000
delegate_kinds = ["planning"]

[roles.implementer]
harness = "codex"
model = "gpt-5.6-terra"
effort = "high"
max_parallel = 1
retries = 2
timeout_seconds = 3600
write = true
output_limit_chars = 8000
delegate_kinds = ["implementation", "test"]

[roles.tester]
harness = "codex"
model = "gpt-5.6-luna"
effort = "medium"
max_parallel = 1
retries = 2
timeout_seconds = 1800
write = false
output_limit_chars = 8000
delegate_kinds = ["test"]

[roles.reviewer]
harness = "claude"
model = "sonnet"
effort = "high"
max_parallel = 1
retries = 0
timeout_seconds = 1800
write = false
output_limit_chars = 8000
delegate_kinds = ["review"]

[roles.debugger]
harness = "codex"
model = "gpt-5.6-sol"
effort = "high"
max_parallel = 1
retries = 2
timeout_seconds = 3600
write = true
output_limit_chars = 10000
delegate_kinds = ["debug"]

[roles.security_reviewer]
harness = "codex"
model = "gpt-5.6-sol"
effort = "xhigh"
max_parallel = 1
retries = 0
timeout_seconds = 3600
write = false
output_limit_chars = 10000
delegate_kinds = ["security_review"]
